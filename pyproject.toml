[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ising-dmrg"
version = "0.1.0"
description = "A small-system implementation of one-site DMRG"
requires-python = ">=3.11"
dependencies = ["numpy"]

[dependency-groups]
dev = ["pytest", "ipykernel", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
